name: Package

# Every push and pull request builds the addon zip and keeps it as a downloadable artifact.
# Pushing a tag (e.g. v1.15.0) also uploads that build to CurseForge and makes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets the packager create the GitHub release on tags

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the packager's changelog

      # -n names the zip and the CurseForge upload alike: addon, version, game (ShardTrim-v1.15.1-forever)
      - name: Package (uploads only for tags)
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ startsWith(github.ref, 'refs/tags/') && ' ' || '-d' }} -n "{package-name}-{project-version}{classic}"

      - name: Keep the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShardTrim
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true # .release starts with a dot, which is skipped by default

      # A copy with a fixed name, so the README's "Download" button
      # (releases/latest/download/ShardTrim.zip) always gets the newest release.
      - name: Attach ShardTrim.zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$(ls .release/*.zip | head -n 1)" ShardTrim.zip
          gh release upload "$GITHUB_REF_NAME" ShardTrim.zip --clobber
